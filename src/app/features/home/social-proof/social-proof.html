<section id="proof" class="section-pad bg-dark">
  <div class="section-eyebrow rt-reveal">Recent Work</div>

  <div class="proof-grid">
    <div>
      <div class="proof-quote rt-reveal">
        {{ caseStudy.summary }}
      </div>
      <ul class="proof-deliverables rt-reveal rt-delay-1">
        @for (item of caseStudy.deliverables; track item) {
          <li>{{ item }}</li>
        }
      </ul>
      <div class="proof-author rt-reveal rt-delay-1">
        <div class="proof-avatar">{{ caseStudy.client.charAt(0) }}</div>
        <div>
          <div class="proof-name">{{ caseStudy.client }}</div>
          <a class="proof-role" [href]="caseStudy.url" target="_blank" rel="noopener">{{ caseStudy.urlLabel }} →</a>
        </div>
      </div>
    </div>

    <div class="proof-partner rt-reveal rt-delay-2">
      <div class="partner-tag">How we work</div>
      @for (item of commitments; track item.title) {
        <div class="partner-logo">
          <div>{{ item.title }}</div>
        </div>
        <p class="partner-desc">{{ item.detail }}</p>
      }
    </div>
  </div>
</section>
